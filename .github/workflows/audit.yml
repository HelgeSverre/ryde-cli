name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/ryde-requirements.txt --quiet
      - run: uvx --from pip-audit pip-audit --requirement /tmp/ryde-requirements.txt --disable-pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit
        working-directory: web
