version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    # Match the Node 24 runtime used by CI and contributors.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
