[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ryde-cli"
version = "0.1.0"
description = "Unofficial Ryde CLI, local ride-map dashboard, and read-only MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Helge Sverre"}]
keywords = ["ryde", "scooter", "cli", "mcp", "ride-history"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "argcomplete>=3.5",
  "cryptography>=43.0",
  "mcp>=1.12.4,<3",
]

[project.urls]
Homepage = "https://github.com/HelgeSverre/ryde-cli"
Repository = "https://github.com/HelgeSverre/ryde-cli"
Issues = "https://github.com/HelgeSverre/ryde-cli/issues"
Changelog = "https://github.com/HelgeSverre/ryde-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
ryde = "ryde_cli.cli:main"
ryde-mcp = "ryde_cli.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ryde_cli"]
exclude = ["src/ryde_cli/agent_skill/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/ryde_cli/agent_skill" = "ryde_cli/agent_skill"

[tool.hatch.build.targets.sdist]
include = ["src/ryde_cli", "tests", "web", "docs", "scripts", "uv.lock", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.hatch.build.targets.sdist.force-include]
"src/ryde_cli/agent_skill" = "src/ryde_cli/agent_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
